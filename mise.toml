[tools]
"github:lucasew/workspaced" = "0.2.3"

[tasks.lint]
run = "workspaced codebase lint"

[tasks.fmt]
run = "workspaced codebase format"

[tasks.test]
depends = ["test:*"]

[tasks."test:fallback"]
run = "echo 'No tests yet'"

[tasks.codegen]
depends = ["codegen:*"]

[tasks."codegen:fallback"]
run = "echo 'No codegen yet'"

[tasks.install]
depends = ["install:*"]

[tasks."install:detect"]
run = '''
if [ -f "package-lock.json" ]; then
    npm ci
elif [ -f "yarn.lock" ]; then
    yarn install --frozen-lockfile
elif [ -f "pnpm-lock.yaml" ]; then
    pnpm install --frozen-lockfile
elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then
    bun install --frozen-lockfile
elif [ -f "Cargo.lock" ]; then
    cargo fetch
elif [ -f "poetry.lock" ]; then
    poetry install
elif [ -f "requirements.txt" ]; then
    pip install -r requirements.txt
elif [ -f "Gemfile.lock" ]; then
    bundle install
elif [ -f "composer.lock" ]; then
    composer install --no-interaction --prefer-dist
elif [ -f "mix.lock" ]; then
    mix deps.get
else
    echo 'No known package manager detected. Skipping install.'
fi
'''

[tasks.ci]
depends = ["lint", "test"]
