name: autorelease
on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: fastai/workflows/ssh@master
        if: github.event_name == 'workflow_dispatch'
        with:
          ssh_key: ${{ secrets.SSH_KEY }}
          key_file: id_ecdsa

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            source script-linux.sh
          else
            source script-mac.sh
          fi
        if: github.event_name == 'workflow_dispatch'

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@c0afd6f790e3a5564914980036ebf83216678101 # v3
        if: github.event_name == 'workflow_dispatch'

      - name: Install mise
        uses: jdx/mise-action@5083fe46898c414b2475087cc79da59e7da859e8 # v2.1.11

      - name: Install dependencies
        run: mise run install
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run codegen
        run: |
          mise run codegen
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR if codegen changed files
        if: matrix.os == 'ubuntu-latest'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update codegen"
          title: "chore: update codegen"
          body: "Auto-generated PR for codegen updates"
          branch: "chore/update-codegen"

      - name: Run CI
        run: mise run ci
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && matrix.os == 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only create release if ref is a tag
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            gh release create "${{ github.ref_name }}" --generate-notes
          fi

      - name: Upload Artifacts
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: ./
